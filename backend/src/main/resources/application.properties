spring.application.name=student-auth-backend
server.port=${PORT:8080} 

# PostgreSQL Database Configuration
# Defaults to localhost:5432/student_db and postgres/admin, can be overridden by .env or system env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Secret must be at least 256 bits / 32 bytes for HS256)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Admin Account Initialization
app.admin.email=admin@example.com
app.admin.password=Admin@12345

# CORS Allowed Origin for React Frontend
app.cors.allowed-origins=https://student-management-1-r3y0.onrender.com/
